### Appearance ###
set -g default-terminal "xterm-256color"
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# window name = running program; claude's binary is named after its version (e.g. 2.1.289)
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9.]+$,#{pane_current_command}},claude,#{pane_current_command}}}#{?pane_dead,[dead],}'

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
set -gq allow-passthrough on
set -g visual-activity off

### Keys ###
# Using C-a as prefix
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

unbind %
bind - split-window -v
unbind '"'
bind | split-window -h

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

### Core Plugins ###
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'jaclu/tmux-menus'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
